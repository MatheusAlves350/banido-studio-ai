name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight test & lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx pytest ruff numpy

      - name: Syntax check (Python AST & JS)
        run: |
          python -c "import ast, pathlib; [ast.parse(f.read_text(encoding='utf-8'), filename=str(f)) for f in pathlib.Path('app').glob('*.py')]"
          node --check app/static/app.js
          bash -n start.sh

      - name: Lint with Ruff
        run: ruff check app tests --select E9,F63,F7,F82,F401,F541,F841

      - name: Run unit & API tests
        env:
          BANIDO_BASE_DIR: /tmp/banido_ci_data
          BANIDO_OBS_DIR: /tmp/banido_ci_obs
          BANIDO_TEMP_DIR: /tmp/banido_ci_tmp
        run: pytest -q
