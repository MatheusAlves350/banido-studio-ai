name: Release (instalador Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar BanidoStudio-Setup.exe
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\banido_studio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: BanidoStudio-Setup
          path: installer/build/BanidoStudio-Setup.exe

      - name: Anexar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/build/BanidoStudio-Setup.exe
          generate_release_notes: true
          body: |
            ## Como instalar (Windows, para quem não programa)

            1. Role até **Assets** (no fim desta página) e baixe **`BanidoStudio-Setup.exe`**.
            2. Dê dois cliques e siga o assistente. Se o Windows avisar "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**.
            3. Aguarde (10 a 30 minutos; downloads grandes) e abra o atalho **Banido Studio AI**.

            **Não baixe "Source code (zip)" ou "Source code (tar.gz)"**: são apenas o código-fonte, para programadores.

            Requisitos: Windows 10/11 de 64 bits, placa NVIDIA (recomendado) e cerca de 15 GB livres.
